name: Publish Extension to Marketplace

on:
  # Trigger on version tags
  push:
    tags:
      - "v*.*.*"

  # Allow manual triggering from GitHub UI
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.1.0, patch, minor, major)"
        required: true
        default: "patch"

jobs:
  build-servers:
    name: Build MCP Server Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build Windows Server
        run: |
          dotnet publish DataverseMetadataMcp.Server/DataverseMetadataMcp.Server.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o vscode-extension/server/win-x64 `
            /p:PublishSingleFile=true `
            /p:DebugType=None `
            /p:DebugSymbols=false

      - name: Build Linux Server
        run: |
          dotnet publish DataverseMetadataMcp.Server/DataverseMetadataMcp.Server.csproj `
            -c Release `
            -r linux-x64 `
            --self-contained false `
            -o vscode-extension/server/linux-x64 `
            /p:PublishSingleFile=true `
            /p:DebugType=None `
            /p:DebugSymbols=false

      - name: Build macOS Server
        run: |
          dotnet publish DataverseMetadataMcp.Server/DataverseMetadataMcp.Server.csproj `
            -c Release `
            -r osx-x64 `
            --self-contained false `
            -o vscode-extension/server/osx-x64 `
            /p:PublishSingleFile=true `
            /p:DebugType=None `
            /p:DebugSymbols=false

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: server-binaries
          path: vscode-extension/server/
          retention-days: 1

  publish:
    name: Publish Extension
    needs: build-servers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          name: server-binaries
          path: vscode-extension/server/

      - name: Make Linux/macOS binaries executable
        run: |
          chmod +x vscode-extension/server/linux-x64/DataverseMetadataMcp.Server
          chmod +x vscode-extension/server/osx-x64/DataverseMetadataMcp.Server

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Run tests
        working-directory: vscode-extension
        run: npm test
        continue-on-error: true # Remove this once you have tests

      - name: Build extension
        working-directory: vscode-extension
        run: npm run package

      - name: Determine version
        id: version
        working-directory: vscode-extension
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            # Extract version from tag (v1.2.3 -> 1.2.3)
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            # Use workflow input
            VERSION="${{ github.event.inputs.version }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Package extension
        working-directory: vscode-extension
        run: npx vsce package --no-dependencies

      - name: Publish to VS Code Marketplace
        working-directory: vscode-extension
        run: npx vsce publish ${{ steps.version.outputs.version }} --no-dependencies -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        working-directory: vscode-extension
        run: npx ovsx publish -p ${{ secrets.OVSX_PAT }}
        continue-on-error: true # Optional: Open VSX is an alternative marketplace
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: vscode-extension/*.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: vscode-extension/*.vsix
          retention-days: 30
